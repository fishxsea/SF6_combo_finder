name: Test and build downloads

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install app and build tools
        run: python -m pip install ".[build]"
      - name: Run tests
        timeout-minutes: 5
        env:
          SF_COMBO_FINDER_HOME: ${{ runner.temp }}/sf-combo-finder-test-data
        run: python -m unittest -v
      - name: Build Python package
        run: python -m build
      - name: Check installed package outside the checkout
        working-directory: ${{ runner.temp }}
        run: sf-combo-finder-cli --list-characters
      - name: Build executable archive
        run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: sf-combo-finder-${{ matrix.os }}
          path: dist/releases/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: python-package
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sf-combo-finder-*
          path: downloads
          merge-multiple: true
      - name: Attach downloads to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" downloads/*.zip --clobber
